---
layout: 'page.njk'
includes:
  - cytoscape
---
<script src="https://unpkg.com/cytoscape/dist/cytoscape.min.js"></script>
<div id="cy" style="width: 600px; height: 400px;"></div>
  <script>
    if(!window.cytoscapes) window.cytoscapes = [];
    window.cytoscapes.push({
      container: document.getElementById('cy'),

      elements: [
        // Define nodes
        { data: { id: 'a' } },
        { data: { id: 'b' } },

        // Define edges, including a loop
        { data: { source: 'a', target: 'a' } },  // Loop on node 'a'
        { data: { source: 'a', target: 'b' } }
      ],

      style: [
        {
          selector: 'node',
          style: {
            'background-color': 'var(--my-theme-color)',
            'label': 'data(id)'
          }
        },
        {
          selector: 'edge',
          style: {
            'width': 3,
            'line-color': '#ff0000'
          }
        }
      ],

      layout: {
        name: 'grid',
        rows: 1
      }
    })
  </script>
